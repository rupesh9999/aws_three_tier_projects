

services:
  # ---- Infrastructure ----
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - payment-network

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - payment-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: paymentadmin
      POSTGRES_PASSWORD: payment_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentadmin -d paymentdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment-network

  # ---- Backend Services ----
  payment-initiation:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-initiation
    container_name: payment-initiation
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: production
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: paymentdb
      DB_USERNAME: paymentadmin
      DB_PASSWORD: payment_secret_2024
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - payment-network

  payment-execution:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-execution
    container_name: payment-execution
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: production
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: paymentdb
      DB_USERNAME: paymentadmin
      DB_PASSWORD: payment_secret_2024
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - payment-network

  payment-tracking:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-tracking
    container_name: payment-tracking
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: production
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: paymentdb
      DB_USERNAME: paymentadmin
      DB_PASSWORD: payment_secret_2024
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - payment-network

  payment-reconciliation:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-reconciliation
    container_name: payment-reconciliation
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_PROFILES_ACTIVE: production
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: paymentdb
      DB_USERNAME: paymentadmin
      DB_PASSWORD: payment_secret_2024
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - payment-network

  payment-billing:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-billing
    container_name: payment-billing
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_PROFILES_ACTIVE: production
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: paymentdb
      DB_USERNAME: paymentadmin
      DB_PASSWORD: payment_secret_2024
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - payment-network

  payment-risk:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-risk
    container_name: payment-risk
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_PROFILES_ACTIVE: production
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: paymentdb
      DB_USERNAME: paymentadmin
      DB_PASSWORD: payment_secret_2024
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - payment-network

  # ---- Frontend ----
  payment-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payment-frontend
    ports:
      - "3000:80"
    depends_on:
      - payment-initiation
    networks:
      - payment-network

volumes:
  postgres_data:

networks:
  payment-network:
    driver: bridge
