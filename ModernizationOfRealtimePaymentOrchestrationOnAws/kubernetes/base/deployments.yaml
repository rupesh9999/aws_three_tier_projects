---
# Payment Initiation Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-initiation
  namespace: payment-system
  labels:
    app: payment-initiation
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-initiation
  template:
    metadata:
      labels:
        app: payment-initiation
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: payment-initiation
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/payment-orchestration-payment-initiation:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: payment-config
            - secretRef:
                name: payment-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-initiation
  namespace: payment-system
spec:
  selector:
    app: payment-initiation
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
  type: ClusterIP
