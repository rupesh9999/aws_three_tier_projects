apiVersion: v1
kind: Namespace
metadata:
  name: payment-system
  labels:
    app.kubernetes.io/part-of: payment-orchestration
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: payment-system
data:
  DB_HOST: "payment-orchestration-production-db.xxxxxxx.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "paymentdb"
  DB_USERNAME: "paymentadmin"
  KAFKA_BOOTSTRAP_SERVERS: "b-1.payment-orchestration.xxxxxx.kafka.us-east-1.amazonaws.com:9092"
  SPRING_PROFILES_ACTIVE: "production"
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
  namespace: payment-system
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
